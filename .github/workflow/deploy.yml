name: Unzip, organize and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unzip and organize any .zip in the repo root
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Unpacking $z"
            rm -rf _z && mkdir _z
            unzip -oq "$z" -d _z
            find _z -type f ! -path '*__MACOSX*' | while read -r f; do
              b=$(basename "$f" | sed -E 's/ \([0-9]+\)//')
              case "$b" in
                index.html|style.css) d=. ;;
                app.js|engine.js|fetchgame.js|review.js|board.js) d=js ;;
                *) echo "skip $b"; continue ;;
              esac
              mkdir -p "$d"
              cp "$f" "$d/$b"
              echo "placed $d/$b"
            done
            rm -rf _z "$z"
          done
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Organize files from zip" || echo "nothing to commit"
          git push || true
      - name: Assemble site
        run: |
          test -f index.html || { echo "index.html missing"; exit 1; }
          mkdir -p site/engine site/vendor _t
          cp -r index.html style.css js site/
          cd _t
          npm init -y >/dev/null
          npm i stockfish@10.0.2 chess.js@1 esbuild >/dev/null
          echo "export { Chess } from 'chess.js'" > e.js
          npx esbuild e.js --bundle --format=esm --minify --outfile=../site/vendor/chess.js
          find node_modules/stockfish \( -name 'stockfish*.js' -o -name '*.wasm' \) -exec cp {} ../site/engine/ \;
          cd ../site/engine
          if ls *single*.js >/dev/null 2>&1; then M=$(ls *single*.js | head -1)
          elif [ -f stockfish.wasm.js ]; then M=stockfish.wasm.js
          else M=stockfish.js; fi
          echo "{\"main\":\"$M\"}" > manifest.json
          ls -la
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
