<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Game review playground</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:dark;--bg:#16181d;--pn:#1e2128;--ln:#323744;--tx:#e4e7ee;--mu:#8b93a7;--ok:#5fd07a;--bad:#ff6b6b;--wr:#f0b95a;--ac:#6ea8ff}
*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;grid-template-columns:minmax(380px,1fr) minmax(420px,1fr);background:var(--bg);color:var(--tx);font:13px/1.45 system-ui,sans-serif}
#left{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--ln)}#right{display:flex;flex-direction:column;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;padding:8px 10px;background:var(--pn);border-bottom:1px solid var(--ln);align-items:center}
.bar label{display:flex;gap:5px;align-items:center;color:var(--mu)}select,input,button,textarea{background:#101217;color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:4px 7px;font:inherit}
button{cursor:pointer}button:hover{border-color:var(--ac)}button.p{background:var(--ac);color:#06101f;border-color:var(--ac);font-weight:600}
#stage{flex:1;display:flex;justify-content:center;background:#0d0e12;overflow:auto;padding:8px}iframe{border:1px solid var(--ln);background:#fff;height:100%;width:100%;max-width:100%;border-radius:6px}
.tabs{display:flex;background:var(--pn);border-bottom:1px solid var(--ln)}.tabs button{border:0;border-radius:0;background:none;padding:8px 12px;color:var(--mu)}.tabs button.on{color:var(--tx);box-shadow:inset 0 -2px var(--ac)}
.pane{display:none;flex:1;min-height:0;flex-direction:column}.pane.on{display:flex}.log{flex:1;overflow:auto;padding:6px 10px;font:12px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all}
.log div{border-bottom:1px solid #20232b}.in{color:#8fb8ff}.out{color:var(--tx)}.err{color:var(--bad)}.warn{color:var(--wr)}.net{color:#c79bff}.mu{color:var(--mu)}
.row{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--ln);align-items:center}.row input{flex:1}
#tl{flex:1;overflow:auto;padding:6px 10px}#tl div{padding:2px 0;cursor:pointer}#tl div:hover{color:var(--ac)}.hint{color:var(--mu);padding:6px 10px}
</style></head><body>
<section id="left">
  <div class="bar">
    <label>Game <select id="game"><option value="">(none)</option></select></label>
    <label>Engine <select id="engine"></select></label>
    <label>Lichess/Chess.com <select id="net"><option>real</option><option>ok</option><option>slow</option><option>fail</option><option>timeout</option><option>empty</option></select></label>
    <label>CPU cores <select id="cores"><option value="">real</option><option>1</option><option>2</option><option>4</option><option>8</option></select></label>
    <label>Memory GB <select id="mem"><option value="">real</option><option>1</option><option>2</option><option>4</option><option>8</option></select></label>
    <label>Screen <select id="size"><option value="">fill</option><option value="360x640">phone 360</option><option value="390x844">phone 390</option><option value="768x1024">tablet</option></select></label>
    <label title="Shrinks the app's 2+ minute timeouts so hangs show up in seconds">Timeouts ÷ <select id="scale"><option>1</option><option>20</option><option>100</option></select></label>
    <button class="p" id="reload">Apply &amp; reload</button>
  </div>
  <div id="stage"><iframe id="app" title="app"></iframe></div>
</section>
<section id="right">
  <div class="tabs" id="tabs"></div>
  <div class="pane" id="p-engine"><div class="log" id="elog"></div><div class="row"><button id="eclear">Clear</button><label class="mu"><input type="checkbox" id="hideinfo" checked> hide "info" lines</label><span id="wk" class="mu"></span></div></div>
  <div class="pane" id="p-console"><div class="log" id="clog"></div><div class="row"><button id="cclear">Clear</button><span class="mu">errors, warnings, network mocks, missing chess.js methods</span></div></div>
  <div class="pane" id="p-lab"><div class="hint">Talk to a mock engine directly. Pick a variant above, then type UCI: <code>uci</code>, <code>isready</code>, <code>position startpos moves e2e4</code>, <code>go depth 8</code>…</div><div class="log" id="llog"></div>
    <div class="row"><button id="lstart">(Re)start worker</button><input id="lin" placeholder="UCI command, Enter to send" autocomplete="off"></div></div>
  <div class="pane" id="p-tests"><div class="row"><select id="suite"></select><button class="p" id="runsuite">Run suite</button><button id="runall">Verify everything</button><button id="stop">Stop</button></div>
    <div class="hint">Click a test id to run just that test.</div><div id="tl"></div><div class="log" id="tlog" style="max-height:38%;border-top:1px solid var(--ln)"></div></div>
  <div class="pane" id="p-report"><div class="row"><button id="rload">Reload report</button></div><div class="log" id="rlog"></div></div>
</section>
<script>
const $ = id => document.getElementById(id), q = new URLSearchParams(location.search);
const TABS = [['engine', 'Engine log'], ['console', 'Console'], ['lab', 'Engine lab'], ['tests', 'Tests'], ['report', 'Report']];
$('tabs').innerHTML = TABS.map(([k, n]) => `<button data-k="${k}">${n}</button>`).join('');
const show = k => { document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.k === k)); document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === 'p-' + k)); if (k === 'tests') loadTests(); if (k === 'report') loadReport(); };
$('tabs').onclick = e => e.target.dataset.k && show(e.target.dataset.k);
show('engine');
const add = (el, cls, text) => { const d = document.createElement('div'); d.className = cls; d.textContent = text; el.appendChild(d); if (el.children.length > 4000) el.removeChild(el.firstChild); el.scrollTop = el.scrollHeight; };

let info = { variants: [], games: [] };
const workers = new Map();
fetch('/__kit/info.json').then(r => r.json()).then(i => {
  info = i;
  $('game').innerHTML += i.games.map(g => `<option value="${g.id}">${g.name} (${g.plies} plies)</option>`).join('');
  $('engine').innerHTML = '<option value="">default (stockfish-19)</option>' + i.variants.filter(v => v.startsWith('mock')).map(v => `<option>${v}</option>`).join('');
  for (const k of ['engine', 'net', 'cores', 'mem', 'size', 'scale', 'game']) if (q.get(k)) $(k).value = q.get(k);
  load();
});
async function load() {
  await fetch('/__kit/set?engine=' + encodeURIComponent($('engine').value));
  const p = new URLSearchParams();
  if ($('net').value !== 'real') p.set('kit_net', $('net').value);
  if ($('cores').value) p.set('kit_cores', $('cores').value);
  if ($('mem').value) p.set('kit_mem', $('mem').value);
  if ($('scale').value !== '1') p.set('kit_scale', $('scale').value);
  const f = $('app'), [w, h] = $('size').value ? $('size').value.split('x') : [null, null];
  f.style.width = w ? w + 'px' : '100%'; f.style.height = h ? Math.min(+h, innerHeight - 100) + 'px' : '100%'; f.style.alignSelf = h ? 'flex-start' : 'stretch';
  workers.clear(); $('wk').textContent = '';
  f.src = '/game-review/?' + p;
  f.onload = () => { const g = info.games.find(x => x.id === $('game').value); if (g) feed(g.pgn); };
}
function feed(pgn) { // same origin: type the PGN into the app's own box and press its button, as a person would
  const d = $('app').contentDocument; if (!d) return;
  const t = d.getElementById('pgn'); if (!t) return;
  const o = d.querySelector('details'); if (o) o.open = true;
  t.value = pgn; t.dispatchEvent(new Event('input', { bubbles: true })); d.getElementById('go')?.click();
}
$('reload').onclick = load; $('game').onchange = load;

addEventListener('message', ({ data: m }) => {
  if (!m || !m.kit) return;
  if (m.type === 'uci') {
    if ($('hideinfo').checked && /^info /.test(m.line) && !/ mate |bestmove/.test(m.line)) return;
    add($('elog'), m.dir === '>' ? 'in' : m.dir === '!' ? 'err' : 'out', `${m.dir === '>' ? '→' : m.dir === '<' ? '←' : '!'} #${m.id} ${m.line}`);
  } else if (m.type === 'worker') {
    if (m.event === 'start') workers.set(m.id, m.name); else workers.delete(m.id);
    add($('elog'), 'mu', `worker #${m.id} ${m.name} ${m.event}`); $('wk').textContent = `${workers.size} worker(s) alive`;
  } else if (m.type === 'console') add($('clog'), m.level === 'error' ? 'err' : 'warn', `[${m.level}] ${m.text}`);
  else if (m.type === 'net') add($('clog'), 'net', `[net:${m.mode}] ${m.url}`);
  else if (m.type === 'ready') add($('clog'), 'mu', `page ready · cores ${m.cores} · memory ${m.mem ?? '?'} · net ${m.net} · timeout ÷${m.scale}`);
});
$('eclear').onclick = () => { $('elog').innerHTML = ''; }; $('cclear').onclick = () => { $('clog').innerHTML = ''; };

// engine lab
let lab = null;
function startLab() {
  lab?.terminate(); $('llog').innerHTML = '';
  const v = $('engine').value || 'stockfish-19-lite-single';
  try { lab = new Worker(`/game-review/engine/${v}.js`); } catch (e) { return add($('llog'), 'err', String(e)); }
  lab.onmessage = e => add($('llog'), 'out', '← ' + e.data); lab.onerror = e => add($('llog'), 'err', '! ' + (e.message || 'worker failed'));
  add($('llog'), 'mu', 'started ' + v);
}
$('lstart').onclick = startLab;
$('lin').onkeydown = e => { if (e.key !== 'Enter' || !e.target.value) return; if (!lab) startLab(); add($('llog'), 'in', '→ ' + e.target.value); lab.postMessage(e.target.value); e.target.value = ''; };

// tests
let loaded = false;
async function loadTests() {
  if (loaded) return; loaded = true;
  const r = await fetch('/__kit/api/list').then(r => r.json()).catch(() => ({ tests: [] }));
  const by = {}; for (const t of r.tests || []) (by[t.id.split('/')[0]] ||= []).push(t.id);
  $('suite').innerHTML = Object.entries(by).map(([k, v]) => `<option value="${k}">${k} (${v.length})</option>`).join('');
  $('tl').innerHTML = ''; window.__by = by; $('suite').onchange = fillList; fillList();
}
function fillList() { const ids = window.__by?.[$('suite').value] || []; $('tl').innerHTML = ''; for (const id of ids) { const d = document.createElement('div'); d.textContent = id; d.onclick = () => run(`run ${id.split('/')[0]} --only '^${id}$'`); $('tl').appendChild(d); } }
let es = null;
function run(args) {
  es?.close(); $('tlog').innerHTML = ''; add($('tlog'), 'mu', 'kit.mjs ' + args);
  es = new EventSource('/__kit/api/run?args=' + encodeURIComponent(args));
  let buf = ''; es.onmessage = e => { add($('tlog'), /FAIL|✗/.test(e.data) ? 'err' : /FLAKY|WARN/.test(e.data) ? 'warn' : 'out', e.data); };
  es.addEventListener('done', e => { add($('tlog'), +e.data ? 'err' : 'out', +e.data ? `finished with exit code ${e.data}` : 'finished: all good'); es.close(); loadReport(); });
  es.onerror = () => { es.close(); };
}
$('runsuite').onclick = () => run('run ' + $('suite').value); $('runall').onclick = () => run('verify --all'); $('stop').onclick = () => es?.close();
async function loadReport() { $('rlog').textContent = await fetch('/__kit/api/report').then(r => r.text()); }
$('rload').onclick = loadReport;
</script></body></html>
