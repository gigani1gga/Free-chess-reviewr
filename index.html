<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121c2b">
<title>Game Review</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Game Review</h1>
  <p class="mut">Paste a Chess.com or Lichess game link. Stockfish runs on your device, free.</p>
  <input id="link" placeholder="https://www.chess.com/game/live/123456789" autocapitalize="off" autocorrect="off" inputmode="url">
  <details>
    <summary>Options</summary>
    <label>Chess.com username (only if the link lookup fails)<input id="user" autocapitalize="off"></label>
    <label>Engine
      <select id="strength">
        <option value="best" selected>Stockfish 19, full strength (~94 MB, downloads once)</option>
        <option value="fast">Stockfish 19 Lite (~2 MB, weaker but quick)</option>
      </select>
    </label>
    <label>Analysis depth
      <select id="depth">
        <option value="12">Fast (12)</option>
        <option value="16" selected>Standard (16)</option>
        <option value="18">Deep (18)</option>
        <option value="20">Very deep (20)</option>
      </select>
    </label>
    <label>Or paste a PGN<textarea id="pgn"></textarea></label>
  </details>
  <button id="go">Review game</button>
  <div class="track"><div id="bar"></div></div>
  <p id="status" class="mut" role="status" aria-live="polite"></p>

  <section id="review" hidden>
    <div id="players"></div>
    <div class="boardrow">
      <div id="evb"><div id="fill"></div></div>
      <div id="board"></div>
    </div>
    <div id="ev" class="mut"></div>
    <div id="engine" class="mut"></div>
    <div id="card" class="card"></div>
    <div id="pvbar" hidden><span id="pvtxt"></span><button id="pvexit">Back to game</button></div>
    <div id="lines"></div>
    <button id="ask" class="ask">Ask Stockfish what it would play here</button>
    <div id="answer" aria-live="polite"></div>
    <div class="nav">
      <button id="first" aria-label="First position" title="First position"><span class="ic" style="--i:url(icons/skip-back.svg)" aria-hidden="true"></span></button>
      <button id="prev" aria-label="Previous move" title="Previous move"><span class="ic" style="--i:url(icons/chevron-left.svg)" aria-hidden="true"></span></button>
      <button id="next" aria-label="Next move" title="Next move"><span class="ic" style="--i:url(icons/chevron-right.svg)" aria-hidden="true"></span></button>
      <button id="last" aria-label="Last position" title="Last position"><span class="ic" style="--i:url(icons/skip-forward.svg)" aria-hidden="true"></span></button>
      <button id="flip" aria-label="Flip board" title="Flip board"><span class="ic" style="--i:url(icons/arrow-up-down.svg)" aria-hidden="true"></span></button>
    </div>
    <div id="graph"></div>
    <div id="acc"></div>
    <div id="moves"></div>
  </section>
</main>
<noscript>This tool needs JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
